<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POSTING MAP - Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/app.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            black: '#000000'
          },
          fontFamily: {
            sans: ['Outfit', 'Noto Sans JP', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-[#000000] text-white flex flex-col justify-between overflow-x-hidden antialiased">
  
  <!-- Main app wrapper optimized for tablet landscape/portrait -->
  <div class="flex-1 flex flex-col justify-center py-12 px-6 sm:px-12 max-w-lg mx-auto w-full">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold tracking-tighter sm:text-4xl">POSTING MAP Generator</h1>
      <p class="text-sm text-secondary tracking-widest uppercase mt-2">Sales Demo Console</p>
    </div>

    <div class="glass-card p-8 sm:p-10 space-y-8">
      <!-- Section 1: District Name Input -->
      <div id="input-container"></div>

      <!-- Section 2: Realtime Progress panel -->
      <div id="progress-container"></div>

      <!-- Section 3: Preview button launcher -->
      <div id="preview-container"></div>
    </div>

    <!-- Footer style matches uppercase tracking standard -->
    <footer class="mt-8 text-center text-[10px] text-secondary tracking-widest uppercase leading-loose">
      Operational environment v5.0<br>
      POSTING MAP / FIELD OPERATIONS PLATFORM
    </footer>

  </div>

  <!-- Boot module -->
  <script type="module">
    import { SalesGeneratorApp } from "./SalesGeneratorApp.js";
    document.addEventListener("DOMContentLoaded", () => {
      const app = new SalesGeneratorApp();
      app.mount({
        inputContainerId: "input-container",
        progressContainerId: "progress-container",
        previewContainerId: "preview-container"
      });
    });
  </script>
</body>
</html>
