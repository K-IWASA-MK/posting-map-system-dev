<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQ REGISTRY MONITOR — FIELD OPERATIONS OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#000000',
            panel: 'rgba(255, 255, 255, 0.02)',
            borderWhite: 'rgba(255, 255, 255, 0.08)',
            accentBlue: '#2563eb'
          },
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
    }
    .glass-card {
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.008));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 30px rgba(37, 99, 235, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .pulse-ready { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .6; transform: scale(1.15); } }
  </style>
</head>
<body class="font-sans antialiased min-h-screen overflow-x-hidden p-8">

  <!-- Main Shell -->
  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- Top Header -->
    <header class="flex justify-between items-center py-6 border-b border-white/10">
      <div class="flex flex-col">
        <h1 class="text-3xl font-black tracking-tighter uppercase leading-none">
          <span class="text-white">HQ Registry</span> <span class="text-blue-500">Monitor</span>
        </h1>
        <p class="text-[10px] font-black text-white/40 uppercase tracking-widest mt-2">SaaS Operational System / 289 Districts</p>
      </div>
      <div class="flex items-center gap-4">
        <span id="last-update" class="text-xs text-white/50 font-bold">Sync: Loading...</span>
        <button onclick="fetchRegistry()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs uppercase px-5 py-3 rounded-full transition-all active:scale-[0.98]">
          Refresh List
        </button>
      </div>
    </header>

    <!-- Overview Metrics Row -->
    <section class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <div class="glass-card p-6 flex flex-col justify-between min-h-[140px]">
        <span class="text-[10px] font-black text-white/40 uppercase tracking-widest">Active Districts</span>
        <span id="stat-districts" class="text-4xl font-black text-white tracking-tight mt-4">--</span>
      </div>
      <div class="glass-card p-6 flex flex-col justify-between min-h-[140px]">
        <span class="text-[10px] font-black text-white/40 uppercase tracking-widest">System Health</span>
        <span id="stat-health" class="text-4xl font-black text-green-500 tracking-tight mt-4">100%</span>
      </div>
      <div class="glass-card p-6 flex flex-col justify-between min-h-[140px]">
        <span class="text-[10px] font-black text-white/40 uppercase tracking-widest">SaaS Version</span>
        <span id="stat-version" class="text-4xl font-black text-blue-400 tracking-tight mt-4">v61</span>
      </div>
      <div class="glass-card p-6 flex flex-col justify-between min-h-[140px]">
        <span class="text-[10px] font-black text-white/40 uppercase tracking-widest">Registry schema</span>
        <span class="text-4xl font-black text-white/70 tracking-tight mt-4">v1.0</span>
      </div>
    </section>

    <!-- Registry Main Grid -->
    <main class="glass-card p-8 space-y-6">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold tracking-tight text-white/80">District Configuration Registry</h2>
        <input type="text" id="search-input" oninput="filterRegistry()" placeholder="Filter by ID or Name..." class="bg-white/5 border border-white/10 rounded-full px-5 py-2.5 text-sm font-semibold outline-none focus:border-blue-500 text-white placeholder:text-white/20 w-64 transition-all">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-white/80">
          <thead>
            <tr class="border-b border-white/10 text-white/40 text-xs font-black uppercase tracking-wider">
              <th class="py-4 px-4">District</th>
              <th class="py-4 px-4">Status</th>
              <th class="py-4 px-4">Latency</th>
              <th class="py-4 px-4">Version</th>
              <th class="py-4 px-4">Last Certification</th>
              <th class="py-4 px-4 text-right">Resources & Admin Control</th>
            </tr>
          </thead>
          <tbody id="registry-table" class="divide-y divide-white/5">
            <!-- Dynamic rows inserted here -->
          </tbody>
        </table>
      </div>
    </main>

  </div>

  <script>
    let registryData = [];

    async function fetchRegistry() {
      try {
        const res = await fetch('clients/registry.json');
        if (!res.ok) throw new Error("Failed to load registry index.");
        const data = await res.json();
        registryData = data.districts || [];
        
        document.getElementById('last-update').textContent = `Sync: ${new Date(data.updatedAt).toLocaleTimeString()}`;
        document.getElementById('stat-districts').textContent = registryData.length;
        
        renderTable(registryData);
      } catch (err) {
        console.error(err);
        document.getElementById('last-update').textContent = "Sync: Offline";
      }
    }

    function renderTable(districts) {
      const tbody = document.getElementById('registry-table');
      tbody.innerHTML = '';
      
      districts.forEach(d => {
        const statusClass = d.status === "READY" ? "bg-green-500" : d.status === "WARNING" ? "bg-yellow-500" : "bg-red-500";
        const latencyText = d.runtime.latency ? `${d.runtime.latency}ms` : "N/A";
        const dateText = d.runtime.lastCertification ? new Date(d.runtime.lastCertification).toLocaleString() : "N/A";
        
        const tr = document.createElement('tr');
        tr.className = "hover:bg-white/[0.01] transition-all";
        tr.innerHTML = `
          <td class="py-5 px-4">
            <div class="font-bold text-white text-base">${d.id}</div>
            <div class="text-xs text-white/40 font-semibold mt-0.5">${d.name}</div>
          </td>
          <td class="py-5 px-4">
            <span class="inline-flex items-center gap-2 text-xs font-black uppercase tracking-wider text-white">
              <span class="w-2.5 h-2.5 rounded-full ${statusClass} pulse-ready"></span>
              ${d.status}
            </span>
          </td>
          <td class="py-5 px-4 font-mono font-bold text-white/60">${latencyText}</td>
          <td class="py-5 px-4 font-mono font-bold text-blue-400">v${d.deployment.version}</td>
          <td class="py-5 px-4 text-xs text-white/50 font-bold">${dateText}</td>
          <td class="py-5 px-4 text-right space-x-2">
            <a href="https://docs.google.com/spreadsheets/d/${d.resources.spreadsheetId}/edit" target="_blank" class="inline-flex bg-white/5 hover:bg-white/10 text-white text-xs font-bold px-4 py-2.5 rounded-full border border-white/5 transition-all">
              Spreadsheet
            </a>
            <a href="https://script.google.com/home/projects/${d.resources.scriptId}/edit" target="_blank" class="inline-flex bg-white/5 hover:bg-white/10 text-white text-xs font-bold px-4 py-2.5 rounded-full border border-white/5 transition-all">
              Apps Script
            </a>
            <a href="${d.resources.webAppUrl}?action=verifyDeployment&apiKey=valid-api-key" target="_blank" class="inline-flex bg-blue-600/10 hover:bg-blue-600/20 text-blue-400 text-xs font-bold px-4 py-2.5 rounded-full border border-blue-500/20 transition-all">
              Web App
            </a>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterRegistry() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = registryData.filter(d => 
        d.id.toLowerCase().includes(q) || d.name.toLowerCase().includes(q)
      );
      renderTable(filtered);
    }

    // Auto load on init
    fetchRegistry();
  </script>
</body>
</html>
