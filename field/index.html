<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POSTING MAP - Field Terminal (H-App)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #000000;
      --panel-bg: #1C1C1E;
      --accent-blue: #2563eb;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.72);
      --border-thin: rgba(255, 255, 255, 0.1);
      --border-blue: rgba(37, 99, 235, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-thin);
      margin-bottom: 1.5rem;
    }

    .user-profile {
      display: flex;
      flex-direction: column;
    }

    .user-id {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .user-trust {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--panel-bg);
      border: 1px solid var(--border-thin);
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-red);
    }

    .indicator.online {
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Premium glass cards styling */
    .premium-glass {
      border-radius: 28px;
      background: var(--panel-bg);
      border: 1px solid var(--border-thin);
      padding: 1.8rem;
      box-shadow: 0 0 30px rgba(37, 99, 235, 0.02);
    }

    .premium-glass.alert-glow {
      border: 1px solid var(--border-blue);
      box-shadow: 0 0 25px rgba(37, 99, 235, 0.05);
    }

    .law-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.4rem;
      border-radius: 20px;
    }

    .law-mode-badge {
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.85rem;
      padding: 0.3rem 0.8rem;
      border-radius: 8px;
    }

    .mode-full { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); }
    .mode-limited { background: rgba(37, 99, 235, 0.15); color: var(--accent-blue); }
    .mode-sandbox { background: rgba(249, 115, 22, 0.15); color: #f97316; }
    .mode-blocked { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }

    .card-title {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .assignment-details {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .flyer-count {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--accent-blue);
    }

    .target-area {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .action-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: auto;
    }

    /* Giant Touch Target Buttons */
    .btn-giant {
      width: 100%;
      padding: 1.4rem;
      border-radius: 24px;
      font-size: 1.15rem;
      font-weight: 700;
      text-align: center;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: #ffffff;
    }

    .btn-primary:active {
      background-color: #1d4ed8;
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--border-thin);
      color: #ffffff;
    }

    .btn-outline:active {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .btn-giant:disabled {
      background-color: rgba(255, 255, 255, 0.05) !important;
      color: var(--text-sub) !important;
      border: 1px solid var(--border-thin) !important;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-sub);
      padding: 3rem 1rem;
    }

    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="user-profile">
      <span class="user-id">S025</span>
      <span class="user-trust">Trust Index: <span id="trust-val">0.850</span></span>
    </div>
    <div class="connection-status">
      <div id="conn-ind" class="indicator"></div>
      <span id="conn-lbl">DISCONNECTED</span>
    </div>
  </header>

  <main class="main-content">
    <!-- Policy Enforcement Warning Banner -->
    <div id="law-banner" class="premium-glass law-panel">
      <span style="font-weight: 600; font-size: 0.95rem;">Execution Policy:</span>
      <span id="law-badge" class="law-mode-badge mode-full">FULL_ACCESS</span>
    </div>

    <!-- Target Assignment Card -->
    <div id="task-card" class="premium-glass alert-glow" style="display: none;">
      <div class="card-title">📬 Current Assignment</div>
      <div class="assignment-details">
        <span class="target-area" id="task-area">Kuwana Area 001</span>
        <span class="flyer-count" id="task-flyers">300 <span style="font-size: 1.2rem; font-weight: 600; color: var(--text-sub);">flyers</span></span>
        <span style="font-size: 0.8rem; color: var(--text-sub); margin-top: 0.5rem;" id="task-meta">Command Link: CMD-XXXX</span>
      </div>
    </div>

    <!-- Empty State Staging waiting area -->
    <div id="empty-card" class="premium-glass empty-state">
      <div class="empty-icon">☕</div>
      <h3>No Active Orders</h3>
      <p style="font-size: 0.9rem; margin-top: 0.4rem;">Waiting for flyer allocation from AIOS Bridge...</p>
    </div>

    <!-- Field Emulator Actions -->
    <div class="action-panel">
      <button id="btn-confirm" class="btn-giant btn-primary">
        Confirm Flyer Distribution
      </button>
      <button id="btn-gps" class="btn-giant btn-outline">
        Transmit Simulated GPS Log
      </button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
