<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POSTING MAP - MIE-03 Data Spreadsheet Viewer</title>
  <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator_midnight.min.css" rel="stylesheet">
  <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg-black: #000000;
      --card-bg: rgba(15, 15, 20, 0.88);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-blue: #2563eb;
      --text-white: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.72);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-black); color: var(--text-white); padding: 24px; display: flex; flex-direction: column; height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .title { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
    .badge { background: rgba(37,99,235,0.2); color: #60a5fa; font-size: 12px; padding: 6px 12px; border-radius: 16px; border: 1px solid rgba(96,165,250,0.4); font-weight: 700; }
    
    .stats-container { display: flex; gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 16px 24px; border-radius: 16px; min-width: 150px; }
    .stat-value { font-size: 28px; font-weight: 800; color: var(--text-white); }
    .stat-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    #example-table { flex-grow: 1; border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; font-size: 13px; }
    
    /* Premium Tabulator overrides */
    .tabulator { background-color: var(--card-bg) !important; border: none !important; }
    .tabulator-header { background-color: #000 !important; border-bottom: 1px solid var(--border-color) !important; color: #fff !important; font-weight: 800 !important; }
    .tabulator-row { background-color: rgba(255,255,255,0.02) !important; border-bottom: 1px solid rgba(255,255,255,0.05) !important; color: #e2e8f0 !important; }
    .tabulator-row:hover { background-color: rgba(37,99,235,0.1) !important; }
    .tabulator-cell { padding: 12px !important; border-right: 1px solid rgba(255,255,255,0.05) !important; }
    
    .btn-download { background: var(--accent-blue); color: #fff; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.2s; }
    .btn-download:hover { background: #1d4ed8; transform: translateY(-1px); }
  </style>
</head>
<body>

<div class="header">
  <div class="title">
    MIE-03 確定データ スプレッドシートビューア
    <span class="badge">Spatial Verification v3.1 Pro</span>
  </div>
  <a href="../FIELD_OPERATIONS_PLATFORM/03_BRANCH/三重県/三重第3区/output/MIE-03_FINAL_VERIFIED_AREAS.csv" download class="btn-download">⬇ CSVダウンロード (Excel用)</a>
</div>

<div class="stats-container">
  <div class="stat-card">
    <div class="stat-value" id="total-count">...</div>
    <div class="stat-desc">全エリア件数</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" style="color: #4ade80;" id="verified-count">...</div>
    <div class="stat-desc">VERIFIED (完全一致)</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" style="color: #fbbf24;" id="warning-count">...</div>
    <div class="stat-desc">WARNING (水域等)</div>
  </div>
</div>

<div id="example-table"></div>

<script>
  Papa.parse("../FIELD_OPERATIONS_PLATFORM/03_BRANCH/三重県/三重第3区/output/MIE-03_FINAL_VERIFIED_AREAS.csv", {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      const data = results.data;
      
      // Calculate stats
      document.getElementById('total-count').textContent = data.length;
      document.getElementById('verified-count').textContent = data.filter(d => d.spatial_status === 'VERIFIED').length;
      document.getElementById('warning-count').textContent = data.filter(d => d.spatial_status === 'WARNING').length;

      // Initialize Tabulator
      var table = new Tabulator("#example-table", {
        data: data,
        layout: "fitDataFill",
        height: "100%",
        columns: [
          {title:"Area ID", field:"area_id", frozen:true, width:130},
          {title:"City", field:"city", headerFilter:"input", width:150},
          {title:"Town", field:"town", headerFilter:"input", width:200},
          {title:"Postal", field:"postal_code", width:100},
          {title:"Lat", field:"latitude", width:110},
          {title:"Lng", field:"longitude", width:110},
          {title:"Source", field:"coordinate_source", width:180},
          {
            title:"Status", 
            field:"spatial_status", 
            width:120,
            formatter: function(cell) {
              const val = cell.getValue();
              if(val === 'VERIFIED') return `<span style="color:#4ade80; font-weight:bold;">${val}</span>`;
              if(val === 'WARNING') return `<span style="color:#fbbf24; font-weight:bold;">${val}</span>`;
              return `<span style="color:#ef4444; font-weight:bold;">${val}</span>`;
            }
          }
        ],
      });
    }
  });
</script>

</body>
</html>
