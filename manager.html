<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ADMIN DASHBOARD v2.0</title>
  <!-- Force Refresh: v200 (2026-05-15T09:14:45) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="apple-touch-icon" href="https://area-management.github.io/posting-map-system/assets/icon-admin-panel-180.png?v=201">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Noto+Sans+JP:wght@400;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#1a237e', light: '#283593', dark: '#0d1642' },
            apple: { light: '#f5f5f7', dark: '#000000' }
          },
          fontFamily: { sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./style.css?v=208">
</head>
<body class="bg-[#000000] text-white font-sans antialiased overflow-hidden select-none transition-colors duration-500">

  <!-- 1. GATEWAY / SPLASH (MANAGER VERSION) -->
  <div id="screen-gateway" class="fixed top-0 left-0 w-full h-[100dvh] z-[1000] bg-[#000000] flex flex-col items-center justify-center p-6 pb-6 text-center">
    <div class="gateway-header-wrap flex flex-col items-center justify-center mb-6 mt-0">
      <div class="gateway-icon-container w-44 h-44 bg-white/5 backdrop-blur-2xl rounded-[3.8rem] border border-white/10 flex items-center justify-center overflow-hidden mb-6 p-1 relative shadow-2xl">
        <img src="https://area-management.github.io/posting-map-system/assets/icon-admin-panel-180.png?v=101" class="w-full h-full object-cover rounded-[3.5rem] z-10">
      </div>
      <div class="text-center">
        <h2 style="color: rgba(255,255,255,0.72);" class="text-base font-black leading-tight">管理者専用画面です</h2>
        <p style="color: rgba(255,255,255,0.4);" class="text-[11px] font-medium mt-2">ホーム画面に追加してご利用ください</p>
      </div>
    </div>
    <div class="gateway-content-wrap w-full max-w-sm space-y-6">
      <div class="gateway-btn-card bg-white/5 backdrop-blur-2xl rounded-[2.5rem] p-8 border border-white/10 shadow-2xl">
        <button onclick="startAdmin()" class="btn-neu w-full bg-[#2563eb] text-white rounded-2xl py-6 text-lg font-black shadow-xl uppercase tracking-tighter">管理画面を起動する</button>
      </div>
      <div class="gateway-footer space-y-1 pt-0">
        <p class="text-[10px] font-black text-gray-600 uppercase tracking-[0.4em]">Administrator</p>
        <p class="text-[10px] font-black text-gray-600 uppercase tracking-[0.4em]">Command Mode</p>
      </div>
    </div>
  </div>

  <!-- 2. LOADING -->
  <div id="loading" class="fixed inset-0 z-[5000] flex flex-col items-center justify-center bg-[#000000] transition-opacity duration-700 hidden">
    <svg class="w-12 h-12" viewBox="0 0 50 50" fill="none" stroke-width="4">
      <circle cx="25" cy="25" r="20" stroke="rgba(255,255,255,0.1)" />
      <path d="M 25 5 A 20 20 0 0 1 45 25" stroke="#2563eb" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite" />
      </path>
    </svg>
    <p class="mt-6 text-[10px] font-black text-white/40 uppercase tracking-[0.3em] animate-pulse">Connecting command console...</p>
  </div>

  <!-- 3. MAIN ADMIN APP -->
  <div id="app" class="fixed inset-0 z-[2000] flex flex-col bg-[#000000] opacity-0 transition-opacity duration-1000 hidden">
    <header class="safe-top px-8 py-8 flex justify-between items-center">
      <h1 class="text-2xl font-black tracking-tighter text-white leading-none">ADMIN PANEL</h1>
      <div class="bg-white/5 backdrop-blur-xl px-5 py-2 rounded-full flex items-center gap-3 border border-white/10">
        <div class="w-2 h-2 bg-[#10b981] rounded-full animate-pulse shadow-[0_0_8px_#10b981]"></div>
        <span class="text-xs font-black text-[#2563eb] tracking-tighter uppercase">API ACTIVE</span>
      </div>
    </header>

    <main id="content" class="flex-1 overflow-y-auto hide-scrollbar px-6 space-y-10 pb-12">
      <!-- 1. KPI Panel -->
      <section class="grid grid-cols-2 gap-4">
        <div class="premium-glass p-6 flex flex-col justify-between h-36">
          <span class="text-[9px] font-black text-gray-500 uppercase tracking-widest">Overall Coverage</span>
          <span id="stat-coverage" class="text-4xl font-black tracking-tighter text-white">0%</span>
          <div class="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
            <div id="stat-progress-bar" class="bg-[#2563eb] h-full transition-all duration-1000 shadow-[0_0_10px_#2563eb]" style="width: 0%;"></div>
          </div>
        </div>
        <div class="premium-glass p-6 flex flex-col justify-between h-36">
          <span class="text-[9px] font-black text-gray-500 uppercase tracking-widest">Active Staff</span>
          <span id="stat-staff" class="text-4xl font-black tracking-tighter text-white">0</span>
          <span class="text-[8px] font-black text-[#10b981] tracking-wider uppercase">● Online Roster</span>
        </div>
      </section>

      <!-- 2. Command Operations -->
      <section class="space-y-4">
        <h3 class="text-[10px] font-black text-gray-500 uppercase tracking-[0.3em] px-2">Tactical Command Center</h3>
        <div class="grid grid-cols-2 gap-4">
          <button onclick="runCommand('forceStartBatch')" class="clickable-card premium-glass p-6 flex flex-col items-center justify-center gap-3 active:scale-95">
            <span class="text-2xl">🚀</span>
            <span class="text-[10px] font-black text-[#2563eb] uppercase tracking-widest">Batch Run</span>
          </button>
          <button onclick="runCommand('refreshCache')" class="clickable-card premium-glass p-6 flex flex-col items-center justify-center gap-3 active:scale-95">
            <span class="text-2xl">🔄</span>
            <span class="text-[10px] font-black text-[#2563eb] uppercase tracking-widest">Cache Sync</span>
          </button>
          <button onclick="runCommand('aggregateStats')" class="clickable-card premium-glass p-6 flex flex-col items-center justify-center gap-3 active:scale-95">
            <span class="text-2xl">📊</span>
            <span class="text-[10px] font-black text-[#2563eb] uppercase tracking-widest">Aggregate</span>
          </button>
          <button onclick="runCommand('resetAllSheets')" class="clickable-card premium-glass p-6 flex flex-col items-center justify-center gap-3 border-rose-500/20 active:scale-95">
            <span class="text-2xl">⚠️</span>
            <span class="text-[10px] font-black text-rose-500 uppercase tracking-widest">System Reset</span>
          </button>
        </div>
      </section>

      <!-- 3. Intel Live Stream Console -->
      <section class="space-y-4">
        <h3 class="text-[10px] font-black text-gray-500 uppercase tracking-[0.3em] px-2">📡 Intel Live Stream</h3>
        <div class="premium-glass p-6">
          <div id="log-console" class="h-40 overflow-y-auto font-mono text-[10px] space-y-2 text-white/50 hide-scrollbar selection:bg-[#2563eb]">
            <div class="text-white/30">&gt; Command console initialized. Ready.</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const API_URL = "https://script.google.com/macros/s/AKfycbyFoJ2Tp7F4MOZ3lNyVDLTl45fVlV-hyAC1uYGL42oXkjBJ3ylST3KUYpaTb0lpK9FmSA/exec";

    // JS Touch Active Handlers
    document.addEventListener('touchstart', e => {
      const el = e.target.closest('.btn-neu, .clickable-card');
      if (!el) return;
      if (el.classList.contains('btn-neu')) el.classList.add('pressed-primary');
      if (el.classList.contains('clickable-card')) el.classList.add('pressed-secondary');
    }, {passive: true});
    document.addEventListener('touchend', removePressed);
    document.addEventListener('touchcancel', removePressed);
    function removePressed() {
      document.querySelectorAll('.pressed-primary, .pressed-secondary').forEach(el => el.classList.remove('pressed-primary', 'pressed-secondary'));
    }

    function addLog(msg) {
      const consoleEl = $('log-console');
      const time = new Date().toLocaleTimeString('ja-JP', { hour12: false });
      const line = document.createElement('div');
      line.className = 'border-b border-white/[0.02] pb-1';
      line.innerHTML = `<span class="text-[#2563eb]">[${time}]</span> <span class="text-white/80">${msg}</span>`;
      consoleEl.appendChild(line);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    async function callApi(action, params = {}) {
      let url = API_URL + "?action=" + action;
      let options = { method: 'POST', redirect: 'follow' };
      options.body = JSON.stringify({ action: action, ...params });
      options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };

      const response = await fetch(url, options);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    }

    async function runCommand(action) {
      if (action === 'resetAllSheets' && !confirm("【警告】すべての地区シートを削除し、システムを完全初期化しますか？\nこの操作は取り消せません。")) {
        return;
      }
      
      $('loading').classList.remove('hidden');
      addLog(`Initiated command: ${action}`);
      
      try {
        const res = await callApi(action);
        if (res && res.success) {
          addLog(`Success: ${res.message || 'Operation completed.'}`);
          alert("コマンドが正常に実行されました。");
          loadDashboardData();
        } else {
          throw new Error(res ? res.message : "API response failed");
        }
      } catch (err) {
        addLog(`Error execution failed: ${err.message}`);
        alert(`エラー: ${err.message}`);
      } finally {
        $('loading').classList.add('hidden');
      }
    }

    async function loadDashboardData() {
      try {
        const appData = await (await fetch(API_URL + "?action=getAppData")).json();
        if (appData && appData.success) {
          const areas = appData.areas || [];
          const total = areas.length;
          const progressSum = areas.reduce((sum, item) => sum + (item.progress || 0), 0);
          const coverage = total > 0 ? Math.round(progressSum / total) : 0;
          
          $('stat-coverage').textContent = `${coverage}%`;
          $('stat-progress-bar').style.width = `${coverage}%`;
          addLog(`Stats updated: overall coverage is ${coverage}% across ${total} districts.`);
        }
        
        const rosterData = await (await fetch(API_URL + "?action=getRoster")).json();
        if (rosterData) {
          $('stat-staff').textContent = rosterData.length || 0;
          addLog(`Online staff list loaded: ${rosterData.length} distributor(s) registered.`);
        }
      } catch (e) {
        addLog(`Dashboard sync failed: ${e.message}`);
      }
    }

    function startAdmin() {
      $('screen-gateway').classList.add('hidden');
      $('loading').classList.remove('hidden');
      $('loading').classList.remove('opacity-0');
      
      loadDashboardData().finally(() => {
        $('app').classList.remove('hidden');
        setTimeout(() => {
          $('app').classList.remove('opacity-0');
          $('loading').classList.add('opacity-0');
          setTimeout(() => $('loading').classList.add('hidden'), 400);
        }, 100);
      });
    }

    // ゲートウェイ画面とローディング画面でのスクロール/バウンスを物理的に防止（即時実行してタイムラグを排除）
    function initScrollLock() {
      const gateway = $('screen-gateway');
      if (gateway) {
        gateway.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
      }
      const loading = $('loading');
      if (loading) {
        loading.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
      }
    }
    initScrollLock();

    window.onload = () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('Service Worker registered for Admin. Scope:', reg.scope))
          .catch(err => console.error('Service Worker registration failed:', err));
      }
    };
  </script>
</body>
</html>
