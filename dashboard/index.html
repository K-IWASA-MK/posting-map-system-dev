<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POSTING MAP - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            black: '#000000'
          },
          fontFamily: {
            sans: ['Outfit', 'Noto Sans JP', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
    }
    .glass-card {
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.008));
      box-shadow: inset 0 0 0 1px rgba(120,140,255,0.08), 0 0 30px rgba(37,99,235,0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .text-secondary {
      color: rgba(255, 255, 255, 0.72);
    }
    .border-default {
      border-color: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden antialiased">
  <!-- Loading overlay -->
  <div id="loading-overlay" class="fixed inset-0 bg-[#000000]/90 backdrop-blur-md flex flex-col items-center justify-center z-[10000] transition-opacity duration-300">
    <div class="w-10 h-10 border-2 border-white/20 border-t-primary rounded-full animate-spin"></div>
  </div>

  <!-- Gateway Screen (Auth) -->
  <div id="auth-screen" class="hidden fixed inset-0 bg-[#000000] flex flex-col items-center justify-center p-6 text-center z-[1000]">
    <div class="glass-card max-w-sm w-full p-8 transition-transform duration-300 scale-95 hover:scale-100">
      <div class="w-16 h-16 rounded-2xl bg-primary/10 border border-primary/20 flex items-center justify-center mx-auto mb-6 text-2xl">
        🔒
      </div>
      <h2 class="text-2xl font-extrabold tracking-tight mb-2">POSTING MAP</h2>
      <p class="text-sm text-secondary mb-8" id="auth-workspace-name">支部ダッシュボード</p>
      <button onclick="handleGoogleLogin()" class="w-full bg-primary hover:bg-primary/95 text-white rounded-full py-4 text-sm font-bold shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
        Googleでログイン
      </button>
    </div>
  </div>

  <!-- Suspended Screen -->
  <div id="suspended-screen" class="hidden fixed inset-0 bg-[#000000] flex flex-col items-center justify-center p-6 text-center z-[2000]">
    <div class="glass-card max-w-sm w-full p-8 border-red-500/20">
      <div class="w-16 h-16 rounded-2xl bg-red-500/10 border border-red-500/20 flex items-center justify-center mx-auto mb-6 text-2xl text-red-500">
        ⚠️
      </div>
      <h2 class="text-xl font-black mb-3">現在、このWorkspaceは利用停止中です。</h2>
      <p class="text-sm text-secondary mb-8 leading-relaxed">契約継続後、ご利用いただけます。</p>
      <button onclick="logout()" class="text-xs font-bold text-red-400 hover:text-red-300 uppercase tracking-widest border-b border-red-400/20 pb-0.5">
        別のアカウントでログイン
      </button>
    </div>
  </div>

  <!-- Dashboard App Shell -->
  <div id="dashboard-app" class="hidden min-h-screen flex flex-col p-6 max-w-4xl mx-auto w-full space-y-8">
    <header class="flex justify-between items-center py-4 border-b border-default">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tighter" id="title-workspace-name">支部ダッシュボード</h1>
        <p class="text-[9px] font-bold text-secondary uppercase tracking-widest mt-1">Operational Environment</p>
      </div>
      <button onclick="logout()" class="text-xs font-bold text-secondary hover:text-white border border-default rounded-full px-4 py-2 hover:bg-white/5 transition-all">
        ログアウト
      </button>
    </header>

    <!-- KPI section -->
    <main class="space-y-6 flex-1">
      <div class="grid grid-cols-2 gap-4">
        <div class="glass-card p-6 flex flex-col justify-center">
          <span class="text-[9px] font-bold text-secondary uppercase tracking-widest mb-2">参加スタッフ</span>
          <span class="text-3xl font-extrabold" id="kpi-staff-count">0人</span>
        </div>
        <div class="glass-card p-6 flex flex-col justify-center">
          <span class="text-[9px] font-bold text-secondary uppercase tracking-widest mb-2">現在保有合計</span>
          <span class="text-3xl font-extrabold" id="kpi-total-holding">0枚</span>
        </div>
      </div>

      <!-- New members -->
      <section class="glass-card p-6 space-y-4">
        <h3 class="text-sm font-bold tracking-tight">🆕 今月新規参加者</h3>
        <div class="divide-y divide-default" id="new-members-list">
          <p class="text-sm text-secondary py-2">今月の新規参加者はいません</p>
        </div>
      </section>

      <!-- Ranking list -->
      <section class="glass-card p-6 space-y-4">
        <h3 class="text-sm font-bold tracking-tight">今月配布活動ランキング</h3>
        <div class="divide-y divide-default" id="ranking-list">
          <p class="text-sm text-secondary py-2">配布活動ログがありません</p>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-[9px] font-bold text-secondary uppercase tracking-widest">
      Operational Environment
    </footer>
  </div>

  <script src="manager.js"></script>
</body>
</html>
