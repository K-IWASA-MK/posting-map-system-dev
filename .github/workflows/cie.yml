name: CIE Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cie-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-doctor-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Run CIE Verify
      run: python3 tools/cie.py verify

    - name: Run CIE Doctor
      run: python3 tools/cie.py doctor

    - name: Run CIE Report
      run: python3 tools/cie.py report
