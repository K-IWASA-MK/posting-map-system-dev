<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIOS Control Center</title>
  <!-- Google Fonts Inter のロード -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Dashboard.css">
</head>
<body>
  <!-- Loading Panel Overlay -->
  <div id="loading-panel" class="loading-overlay">
    <div class="skeleton-spinner"></div>
    <span>Loading AIOS Control Center...</span>
  </div>

  <!-- Error Panel Overlay -->
  <div id="error-panel" class="error-overlay" style="display: none;"></div>

  <div class="app-container">
    <!-- Warning Banner Component -->
    <div id="warning-panel" class="warning-banner" role="alert" aria-live="assertive" style="display: none;"></div>

    <!-- Header Component (Slide Down) - Integrated with Spacing Tokens -->
    <header class="dashboard-header" role="banner" aria-label="AIOS Dashboard Header" data-motion="slide-down" data-delay="0">
      <div class="header-logo">
        <h1>AIOS Control Center</h1>
        <div id="header-tenant-context" class="header-tenant-badge" style="display: none;"></div>
      </div>
      <div class="header-status-panel" role="status" aria-live="polite" aria-label="AIOS Operational Status">
        <span class="status-badge environment">Environment: <strong id="env-text">LOCAL SIMULATION</strong></span>
        <span class="status-badge health-status">Status: <strong id="status-text" class="accent-green">LIVE</strong></span>
        <span class="status-badge realtime-status">Stream: <strong id="realtime-status-text" class="realtime-offline">● OFFLINE</strong></span>
        <span class="status-badge update-time">Last Update: <span id="update-time-text">-</span></span>
      </div>
    </header>

    <div class="body-container">
      <!-- Sidebar Component (Slide In Left) -->
      <aside class="dashboard-sidebar" role="complementary" aria-label="AIOS Sidebar" data-motion="slide-in-left" data-delay="100">
        <nav class="sidebar-nav" role="navigation" aria-label="AIOS Sidebar Navigation">
          <ul>
            <li id="menu-global"><a href="?view=global">Global Overview</a></li>
            <li id="menu-tenant"><a href="?view=tenant">Tenant Boundary</a></li>
            <li id="menu-executive"><a href="?view=executive">AIOS Executive</a></li>
            <li id="menu-raw"><a href="?view=raw">AIOS Pipeline</a></li>
            <li id="menu-trust"><a href="?view=trust">Trust Governance</a></li>
          </ul>
        </nav>
        <div class="sidebar-footer">
          <p class="footer-tracking">OPERATIONAL</p>
          <p class="footer-tracking">ENVIRONMENT</p>
        </div>
      </aside>

      <!-- Main Dashboard View -->
      <main class="dashboard-main" role="main" aria-label="AIOS Main Content">
        <!-- Component Mount Container -->
        <div id="dashboard-grid-container" class="dashboard-grid" aria-readonly="true" aria-label="AIOS Dashboard Grid"></div>
      </main>
    </div>
  </div>
