<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIOS Kernel Dashboard</title>
  <!-- Google Fonts Inter のロード -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Dashboard.css">
</head>
<body>
  <!-- Loading Panel Overlay -->
  <div id="loading-panel" class="loading-overlay">
    <div class="skeleton-spinner"></div>
    <span>Loading AIOS Kernel Metrics...</span>
  </div>

  <!-- Error Panel Overlay -->
  <div id="error-panel" class="error-overlay" style="display: none;"></div>

  <div class="app-container">
    <!-- Warning Banner Component -->
    <div id="warning-panel" class="warning-banner" style="display: none;"></div>

    <!-- Header Component (Slide Down) -->
    <header class="dashboard-header" data-motion="slide-down" data-delay="0">
      <div class="header-logo">
        <h1>AIOS Kernel Dashboard</h1>
      </div>
      <div class="header-status-panel">
        <span class="status-badge environment">Environment: <strong id="env-text">LOCAL SIMULATION</strong></span>
        <span class="status-badge health-status">Status: <strong id="status-text" class="accent-green">HEALTHY</strong></span>
        <span class="status-badge update-time">Last Update: <span id="update-time-text">-</span></span>
      </div>
    </header>

    <div class="body-container">
      <!-- Sidebar Component (Slide In Left) -->
      <aside class="dashboard-sidebar" data-motion="slide-in-left" data-delay="100">
        <nav class="sidebar-nav">
          <ul>
            <li class="active">Dashboard</li>
            <li>Kernel Status</li>
            <li>Quality</li>
            <li>Knowledge</li>
            <li>Governance</li>
            <li>Billing</li>
            <li>Simulation</li>
            <li>Audit</li>
          </ul>
        </nav>
        <div class="sidebar-footer">
          <p class="footer-tracking">OPERATIONAL</p>
          <p class="footer-tracking">ENVIRONMENT</p>
        </div>
      </aside>

      <!-- Main Dashboard View -->
      <main class="dashboard-main">
        <!-- Component Mount Container -->
        <div id="dashboard-grid-container" class="dashboard-grid"></div>
      </main>
    </div>
  </div>

  <!-- Component Scripts -->
  <script src="components/KPICard.js"></script>
  <script src="components/StatusCard.js"></script>
  <script src="components/MetricCard.js"></script>
  <script src="components/KnowledgeCard.js"></script>
  <script src="components/GovernanceCard.js"></script>
  <script src="components/BillingCard.js"></script>
  <script src="components/SimulationCard.js"></script>

  <!-- Control & Data Scripts -->
  <script src="DashboardDataAdapter.js"></script>
  <script src="DashboardRenderer.js"></script>
  <script src="DashboardMotion.js"></script>
  <script src="Dashboard.js"></script>
</body>
</html>
