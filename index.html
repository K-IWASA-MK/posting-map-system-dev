<body class="bg-apple text-[#1d1d1f] font-sans antialiased overflow-hidden select-none">

  <!-- Gateway / Splash -->

    <div class="flex-1 flex flex-col items-center justify-center">

        <img src="https://area-management.github.io/posting-map-system/assets/icon180-v2.png?v=73" class="w-full h-full object-cover">

        ホーム画面に追加してから<br>ご利用ください

    <button onclick="forceStart()" class="w-full max-w-sm bg-navy hover:bg-navy-light text-white rounded-2xl py-5 text-lg font-bold shadow-xl shadow-navy/20 transition-all active:scale-[0.98]">

    </button>

  <!-- Main Shell -->
  <div id="app-shell" class="hidden flex flex-col h-screen">
    <header class="bg-white/80 backdrop-blur-xl border-b border-gray-100 safe-top z-50">
      <div class="px-6 py-4 flex justify-between items-center">
        <div class="flex flex-col">
          <div class="text-xl font-black tracking-tighter leading-none">
            <span class="text-navy">POSTING</span> <span class="text-blue-500">MAP</span>
          </div>
          <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mt-1">Field Command</p>
        </div>
        <div id="header-sync" class="flex items-center gap-2 bg-green-50 px-3 py-1.5 rounded-full border border-green-100">
          <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
          <span id="sync-pct" class="text-[11px] font-black text-green-700 tracking-tighter">0%</span>
          <span class="text-[9px] font-bold text-green-600 tracking-widest">SYNC</span>
        </div>
      </div>
    </header>

    <main id="main-view" class="flex-1 overflow-y-auto hide-scrollbar p-6 space-y-6 safe-bottom pb-32">
      <!-- Dynamic Content -->
    </main>

    <!-- Bottom Nav (Floating) -->
    <nav class="fixed bottom-6 left-6 right-6 bg-white/90 backdrop-blur-2xl rounded-full shadow-2xl border border-white/20 flex justify-around items-center p-2 z-[100] ring-1 ring-black/5">
      <button id="nav-manual" onclick="switchTab('manual')" class="flex flex-col items-center justify-center w-16 py-2 transition-all nav-item active text-gray-300">
        <span class="text-2xl mb-1 transition-transform duration-300">📖</span>
        <span class="text-[9px] font-black uppercase tracking-tighter">Guide</span>
      </button>
      <button id="nav-area" onclick="switchTab('area')" class="flex flex-col items-center justify-center w-16 py-2 transition-all nav-item text-gray-300">
        <span class="text-2xl mb-1 transition-transform duration-300">🗺️</span>
        <span class="text-[9px] font-black uppercase tracking-tighter">Areas</span>
      </button>
      <button id="nav-settings" onclick="switchTab('settings')" class="flex flex-col items-center justify-center w-16 py-2 transition-all nav-item text-gray-300">
        <span class="text-2xl mb-1 transition-transform duration-300">⚙️</span>
        <span class="text-[9px] font-black uppercase tracking-tighter">Settings</span>
      </button>
    </nav>
  </div>

  <!-- Diagnostic HUD Overlay -->
  <div id="liff-hud" class="fixed top-4 left-4 right-4 bg-black/90 backdrop-blur-md text-white rounded-2xl p-4 text-xs font-mono z-[100000] border border-white/20 shadow-2xl space-y-1">
    <div class="font-bold text-blue-400 text-xs border-b border-white/20 pb-1 mb-2 flex justify-between">
      <span>📱 REAL-TIME DIAGNOSTIC HUD</span>
      <span id="hud-os" class="text-gray-400">OS: -</span>
    </div>
    <div>1. LIFF Init: <span id="hud-init" class="font-bold text-yellow-400">WAITING</span></div>
    <div>2. LoggedIn: <span id="hud-login" class="font-bold text-yellow-400">WAITING</span></div>
    <div>3. Profile: <span id="hud-profile" class="font-bold text-yellow-400">WAITING</span></div>
    <div>4. Register Staff: <span id="hud-register" class="font-bold text-yellow-400">WAITING</span></div>
    <div>5. getAppData: <span id="hud-appdata" class="font-bold text-yellow-400">WAITING</span></div>
    <div class="text-[9px] text-gray-400 pt-1 border-t border-white/10 mt-1 break-all" id="hud-url"></div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="fixed inset-0 bg-white/90 backdrop-blur-sm z-[10000] hidden flex flex-col items-center justify-center">
    <div class="w-12 h-12 border-4 border-gray-100 border-t-navy rounded-full animate-spin-custom"></div>
    <p id="loading-msg" class="mt-6 text-navy font-black tracking-tight">同期中...</p>
  </div>

  <div id="toast" class="fixed bottom-28 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full text-white text-sm font-bold shadow-2xl hidden z-[11000] whitespace-nowrap border border-white/10 transition-all"></div>

  <script>
    console.log("window.location.href =", window.location.href);
    console.log("window.location.origin =", window.location.origin);
    console.log("window.location.pathname =", window.location.pathname);

    const API_URL = (window.PMS_CLIENT_CONFIG && window.PMS_CLIENT_CONFIG.api) 
      ? window.PMS_CLIENT_CONFIG.api.gasWebAppUrl 
      : 'https://script.google.com/macros/s/AKfycbxyHvUbJ3yVwXX8sIdK_mWb6ML5ChmFX3mfv-nlEv1DDCv30hBQJlngM096_zLW04vQ/exec';
    
    const LIFF_ID = (window.PMS_CLIENT_CONFIG && window.PMS_CLIENT_CONFIG.line && window.PMS_CLIENT_CONFIG.line.liffId)
      ? window.PMS_CLIENT_CONFIG.line.liffId
      : "2010374196-bHBYo37e";

    let appData = null;
    let currentUser = {
      displayName: localStorage.getItem('posting_display_name') || '岩佐CEO',
      name: localStorage.getItem('posting_display_name') || '岩佐CEO',
      userId: 'U_IWASA_CEO_OFFICIAL'
    };
    let currentTab = 'settings';

    function setHud(step, text, isOk, extra = '') {
      const el = document.getElementById('hud-' + step);
      if (!el) return;
      el.textContent = (isOk === true ? 'OK ' : isOk === false ? 'NG ' : '') + text + (extra ? ` (${extra})` : '');
      el.className = 'font-bold ' + (isOk === true ? 'text-green-400' : isOk === false ? 'text-red-400' : 'text-yellow-400');
    }

    async function initLiff() {
      const hudUrl = document.getElementById('hud-url');
      if (hudUrl) hudUrl.textContent = 'URL: ' + window.location.href;

      if (typeof liff === 'undefined') {
        console.warn('[LIFF] SDK not loaded.');
        setHud('init', 'SDK NOT LOADED', false);
        return false;
      }
      try {
        await liff.init({ liffId: LIFF_ID });
        console.log('[LIFF] Init success with ID:', LIFF_ID);
        setHud('init', 'Init Success', true);

        const os = liff.getOS();
        const hudOs = document.getElementById('hud-os');
        if (hudOs) hudOs.textContent = 'OS: ' + os;

        const loggedIn = liff.isLoggedIn();
        console.log("LIFF LoggedIn =", loggedIn);
        setHud('login', loggedIn ? 'LoggedIn' : 'Not LoggedIn (login())', loggedIn);

        if (!loggedIn) {
          if (os === 'web') {
            console.log('[LIFF] Web environment detected. Allowing PC browser preview...');
            setHud('login', 'Web PC Mode', true);
            setHud('profile', 'PC Demo User', true, '岩佐CEO');
            currentUser = {
              userId: 'U_IWASA_CEO_OFFICIAL',
              displayName: '岩佐CEO',
              pictureUrl: '',
              name: '岩佐CEO'
            };
            return true;
          }
          console.log('[LIFF] User not logged in. Redirecting to LINE Login...');
          liff.login();
          return false;
        }

        console.log("Before getProfile");
        const liffProfile = await liff.getProfile();
        console.log("After getProfile", liffProfile);
        setHud('profile', 'Profile Loaded', true, liffProfile ? liffProfile.displayName : '');

        if (liffProfile) {
          currentUser = {
            userId: liffProfile.userId,
            displayName: liffProfile.displayName,
            pictureUrl: liffProfile.pictureUrl || '',
            name: liffProfile.displayName
          };
          localStorage.setItem('posting_display_name', liffProfile.displayName);
          localStorage.removeItem('liff_profile');
          localStorage.removeItem('posting_user');
          
          setHud('register', 'Sending...', null);
          const regRes = await api('registerStaff', { 
            lastName: liffProfile.displayName, 
            firstName: 'LINE', 
            lineUserId: liffProfile.userId 
          }, 'POST');

          if (regRes && regRes.success) {
            setHud('register', 'Saved to GAS', true);
          } else {
            setHud('register', 'GAS Fail', false);
          }
        }
        return true;
      } catch (err) {
        console.error('[LIFF] Init/Login Error:', err);
        const errMsg = err.message || err.toString();
        setHud('profile', 'Error', false, errMsg);
        if (typeof liff !== 'undefined') {
          console.log("isLoggedIn =", liff.isLoggedIn());
          console.log("AccessToken =", liff.getAccessToken());
          console.log("IDToken =", liff.getIDToken());
          if (errMsg.includes('revoked') || errMsg.includes('invalid') || errMsg.includes('token') || errMsg.includes('400')) {
            console.warn('[LIFF Auto-Recovery] Stale token detected. Purging session & triggering login()...');
            try { if (liff.isLoggedIn()) liff.logout(); } catch(e) {}
            setTimeout(() => { liff.login(); }, 800);
          }
        }
      }
      return false;
    }

    function loginWithLine() {
      if (typeof liff !== 'undefined' && liff.init) {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          initLiff().then(() => renderView());
        }
      } else {
        showToast('LINE SDKが読み込まれていません', true);
      }
    }

    function getAuthToken() {
      let token = null;
      try {
        if (typeof liff !== 'undefined' && liff.isLoggedIn && liff.isLoggedIn()) {
          token = liff.getAccessToken() || liff.getIDToken();
        }
      } catch (e) {
        console.warn('[API Auth] Failed to read token from LIFF SDK:', e);
      }

      if (!token && typeof localStorage !== 'undefined') {
        token = localStorage.getItem('liff_token') || localStorage.getItem('posting_token') || localStorage.getItem('posting_liff_token') || localStorage.getItem('liff_access_token');
      }

      if (!token) {
        const os = (typeof liff !== 'undefined' && liff.getOS) ? liff.getOS() : 'web';
        if (os === 'web' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          token = 'valid-liff-token';
        }
      }

      if (token && typeof localStorage !== 'undefined') {
        localStorage.setItem('liff_token', token);
        localStorage.setItem('posting_token', token);
      }

      return token;
    }

    async function api(action, params = {}, method = 'GET') {
      const url = new URL(API_URL);
      url.searchParams.append('action', action);
      
      const token = getAuthToken();
      if (token) {
        url.searchParams.append('liffToken', token);
      }

      Object.keys(params).forEach(k => {
        if (typeof params[k] !== 'object' && params[k] !== undefined) {
          url.searchParams.append(k, params[k]);
        }
      });
      try {
        const options = { method: method, redirect: 'follow' };
        if (method === 'POST') {
          const formData = new FormData();
          formData.append('json', JSON.stringify({ action, liffToken: token, ...params }));
          options.body = formData;
        }

        console.log(`[API ${action}] Sending request (Token Injected: ${!!token})...`);
        const response = await fetch(url.toString(), options);
        console.log(`[API ${action}] HTTP Status:`, response.status);
        const text = await response.text();
        console.log(`[API ${action}] Raw Response:`, text);
        try {
          return JSON.parse(text);
        } catch (e) {
          console.error(`[API ${action}] JSON parse failed. Raw response was:`, text);
          return null;
        }
      } catch (err) { 
        console.error(`[API ${action}] Fetch error:`, err);
        return null; 
      }
    }

    function init() {
      startApp();
    }

    async function startApp() {
      console.log("startApp() called");
      document.getElementById('screen-gateway').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      showLoading('LINE認証確認中...');
      const ok = await initLiff();
      if (!ok) {
        hideLoading();
        showToast("LINE認証に失敗しました", true);
        return;
      }
      if (currentUser) {
        setHud('register', 'Sending...', null);
        api('registerStaff', {
          lastName: currentUser.displayName || currentUser.name,
          firstName: 'LINE',
          lineUserId: currentUser.userId || 'U_IWASA_CEO_OFFICIAL'
        }, 'POST').then(regRes => {
          const rawReg = (regRes && regRes.data) ? regRes.data : regRes;
          if (rawReg && rawReg.success !== false) {
            setHud('register', 'Saved to GAS', true);
          } else {
            setHud('register', 'GAS Fail', false);
          }
        }).catch(err => {
          console.error('[GAS Register Error]', err);
          setHud('register', 'Error', false);
        });
      }
      switchTab(currentUser ? 'area' : 'settings');
      showLoading('同期中...');
      const rawRes = await api('getAppData');
      const data = (rawRes && rawRes.data) ? rawRes.data : rawRes;
      hideLoading();
      const hudData = document.getElementById('hud-appdata');
      if (hudData) {
        if (!data) {
          hudData.className = 'font-bold text-red-400';
          hudData.textContent = 'NG (null)';
        } else if (data.success === false || (rawRes && rawRes.success === false)) {
          const errObj = (rawRes && rawRes.error) || (data && data.error);
          hudData.className = 'font-bold text-red-400';
          hudData.textContent = 'NG (' + (errObj ? errObj.code : 'Fail') + ')';
        } else if (!data.areas) {
          hudData.className = 'font-bold text-orange-400';
          hudData.textContent = 'NG (areas missing)';
        } else {
          hudData.className = 'font-bold text-green-400';
          hudData.textContent = 'OK (areas: ' + data.areas.length + ')';
        }
      }
      if (data) {
        appData = data;
        document.getElementById('sync-pct').textContent = currentUser ? '100%' : '0%';
        renderView();
      } else {
        showToast('通信エラー: 再試行してください', true);
        renderView();
      }
    }

    function forceStart() { startApp(); }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('nav-' + tab);
      if (target) target.classList.add('active');
      renderView();
    }

    function renderView() {
      const main = document.getElementById('main-view');
      if (!main) return;
      main.innerHTML = '';
      if (currentTab === 'settings') {
        renderSettings(main);
      } else if (currentTab === 'area') {
        renderAreaList(main);
      } else if (currentTab === 'manual') {
        main.innerHTML = `
          <div class="bg-white rounded-[2rem] shadow-sm p-12 text-center flex flex-col items-center ring-1 ring-black/[0.01]">
            <span class="text-5xl mb-6">📖</span>
            <h2 class="text-2xl font-black text-navy mb-3 tracking-tight">準備中です</h2>
            <p class="text-gray-500 font-medium leading-relaxed">マニュアルコンテンツを現在作成しています。<br>しばらくお待ちください。</p>
          </div>
        `;
      }
    }

    function renderSettings(main) {
      if (!currentUser) {
        main.innerHTML = `
          <h2 class="text-2xl font-black text-navy mb-6 tracking-tight">ログイン・認証</h2>
          <div class="bg-white rounded-[2rem] p-8 shadow-sm ring-1 ring-black/[0.01] space-y-6">
            <div class="inline-flex px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest bg-orange-100 text-orange-700">Unauthenticated</div>
            
            <button onclick="loginWithLine()" class="w-full bg-[#06C755] hover:bg-[#05b34c] text-white rounded-2xl py-5 font-black text-lg shadow-xl shadow-green-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
              <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 5.92 2 10.75c0 4.31 3.55 7.92 8.35 8.61.32.07.76.22.87.5.12.31.08.79.04 1.1-.06.49-.28 1.95-.31 2.37-.05.67.31.66.65.43.34-.23 5.4-3.18 7.37-5.44C20.66 16.53 22 13.82 22 10.75 22 5.92 17.52 2 12 2z"/></svg>
              LINEでログイン
            </button>

            <div class="relative flex py-2 items-center">
              <div class="flex-grow border-t border-gray-200"></div>
              <span class="flex-shrink mx-4 text-xs font-bold text-gray-400">または手動で登録</span>
              <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <div class="space-y-4">
              <div class="space-y-1">
                <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">苗字（全角）</label>
                <input type="text" id="reg-last" placeholder="例：鈴木" class="w-full bg-apple border-2 border-transparent focus:border-navy focus:bg-white rounded-2xl p-4 text-lg font-bold outline-none transition-all placeholder:text-gray-300">
              </div>
              <div class="space-y-1">
                <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">名前（全角）</label>
                <input type="text" id="reg-first" placeholder="例：一郎" class="w-full bg-apple border-2 border-transparent focus:border-navy focus:bg-white rounded-2xl p-4 text-lg font-bold outline-none transition-all placeholder:text-gray-300">
              </div>
              <button onclick="handleRegister()" class="w-full bg-navy text-white rounded-2xl py-4 font-black shadow-xl shadow-navy/20 active:scale-[0.98] transition-all">手動登録を完了する</button>
            </div>
          </div>
        `;
      } else {
        const avatar = currentUser.pictureUrl
          ? `<img src="${currentUser.pictureUrl}" class="w-20 h-20 rounded-full mx-auto mb-4 border-2 border-green-500 shadow-md object-cover">`
          : `<div class="w-20 h-20 rounded-full bg-navy/10 text-navy font-black text-2xl flex items-center justify-center mx-auto mb-4">${(currentUser.name || 'U').charAt(0)}</div>`;

        main.innerHTML = `
          <h2 class="text-2xl font-black text-navy mb-6 tracking-tight">アカウント設定</h2>
          <div class="bg-white rounded-[2rem] p-10 shadow-sm text-center ring-1 ring-black/[0.01]">
            <div class="inline-flex px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest bg-green-100 text-green-700 mb-6">Authenticated</div>
            ${avatar}
            <h3 class="text-3xl font-black text-navy mb-2 tracking-tighter">${currentUser.displayName || currentUser.name} 様</h3>
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-8 break-all">LINE User ID: ${currentUser.userId || currentUser.id}</p>
            <button onclick="logout()" class="text-xs font-black text-red-400 uppercase tracking-widest border-b-2 border-red-50/50 hover:text-red-600 transition-colors">ログアウト</button>
          </div>
        `;
      }
    }

    function renderAreaList(main) {
      if (!appData || !Array.isArray(appData.areas)) {
        main.innerHTML = `<div class="bg-white rounded-[2rem] p-12 text-center shadow-sm"><p class="text-gray-400 font-bold mb-6">データを同期しています...</p><button onclick="startApp()" class="text-navy font-black border-b-2 border-navy/20">再試行する</button></div>`;
        return;
      }
      const list = appData.areas.map(a => `
        <div class="bg-white rounded-3xl p-6 flex items-center shadow-sm border border-gray-50 active:scale-[0.98] transition-all ring-1 ring-black/[0.01]">
          <div class="w-3 h-3 rounded-full mr-5 ${a.progress >= 100 ? 'bg-green-500 shadow-lg shadow-green-200' : a.progress > 0 ? 'bg-orange-400 shadow-lg shadow-orange-200' : 'bg-gray-200'}"></div>
          <div class="flex-1">
            <div class="text-lg font-black text-navy tracking-tight leading-tight">${a.name}</div>
            <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-0.5">Target Area</div>
          </div>
          <div class="text-right">
            <div class="text-xl font-black text-navy leading-none">${a.progress}<span class="text-[10px] ml-0.5">%</span></div>
            <div class="w-16 h-1 bg-gray-100 rounded-full mt-2 overflow-hidden">
              <div class="h-full ${a.progress >= 100 ? 'bg-green-500' : 'bg-orange-400'}" style="width:${a.progress}%"></div>
            </div>
          </div>
        </div>
      `).join('');
      main.innerHTML = `<h2 class="text-2xl font-black text-navy mb-6 tracking-tight">配布エリア一覧</h2><div class="space-y-4">${list}</div>`;
    }

    async function handleRegister() {
      const last = document.getElementById('reg-last').value;
      const first = document.getElementById('reg-first').value;
      if (!last || !first) return showToast('苗字と名前を入力してください', true);
      showLoading('登録中...');
      const res = await api('registerStaff', { lastName: last, firstName: first }, 'POST');
      hideLoading();
      if (res && res.success) {
        currentUser = { id: res.id, name: res.name };
        localStorage.setItem('posting_user', JSON.stringify(currentUser));
        showToast('登録が完了しました');
        startApp();
      } else { showToast('登録に失敗しました', true); }
    }

    function showLoading(msg) { document.getElementById('loading-msg').textContent = msg; document.getElementById('loading-overlay').classList.remove('hidden'); }
    function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }
    function showToast(msg, isErr=false) {
      const t = document.getElementById('toast');
      t.textContent = msg; 
      t.className = `fixed bottom-28 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full text-white text-sm font-bold shadow-2xl z-[11000] whitespace-nowrap border border-white/10 transition-all ${isErr ? 'bg-red-500' : 'bg-navy'}`;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3000);
    }
    function logout() { if(confirm("ログアウトしますか？")){localStorage.removeItem('posting_display_name'); localStorage.removeItem('posting_user'); localStorage.removeItem('liff_profile'); currentUser=null; startApp();} }
    init();
  </script>
</body>
</html>
